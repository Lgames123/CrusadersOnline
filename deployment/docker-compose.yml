# Full stack: PostgreSQL + authoritative server + Caddy (static client and reverse proxy).
#   cp deployment/.env.example deployment/.env    # set DB_PASSWORD
#   docker compose -f deployment/docker-compose.yml --env-file deployment/.env up -d --build
# Local test: http://localhost:8088 (guests are disabled in production; register an account).
name: crusadersonline

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: crusaders_online
      POSTGRES_USER: crusaders
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deployment/.env}
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crusaders -d crusaders_online"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://crusaders:${DB_PASSWORD}@db:5432/crusaders_online
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # "synthetic-arena", or an original level act such as "level:ca1a". Original levels need the
      # operator's own conversion (pnpm convert on their copy of the game) mounted below; players
      # import their own copy in the browser for graphics and sound.
      ARENA: ${ARENA:-synthetic-arena}
      GENERATED_DIR: /app/local/generated
      ITEM_RULES: ${ITEM_RULES:-}
      GAME_FEATURES: ${GAME_FEATURES:-}
      # Accounts (usernames, comma-separated) given the admin panel.
      ADMIN_USERS: ${ADMIN_USERS:-}
      REALM_NAME: ${REALM_NAME:-}
      # GET /metrics on server:8080 (not proxied by Caddy); a scraper on this network reads it.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    volumes:
      - ${GENERATED_DIR:-../local/generated}:/app/local/generated:ro
    networks: [internal]

  web:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${WEB_PORT:-8088}:80"
      - "${WEB_TLS_PORT:-8443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

  # Scheduled pg_dump backups into ${BACKUP_DIR} (default deployment/backups); see backup/backup.sh.
  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "/scripts/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: crusaders
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: crusaders_online
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - ./backup/backup.sh:/scripts/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    networks: [internal]

  # Off-host copies of those dumps with rclone (backup/offsite.sh); only with `--profile offsite`.
  # Configure the remote in ${RCLONE_CONFIG_DIR}/rclone.conf (an rclone `crypt` remote encrypts).
  offsite:
    image: rclone/rclone:1.68.2
    profiles: [offsite]
    restart: unless-stopped
    entrypoint: ["sh", "/scripts/offsite.sh"]
    environment:
      OFFSITE_REMOTE: ${OFFSITE_REMOTE:-}
      OFFSITE_INTERVAL_SECONDS: ${OFFSITE_INTERVAL_SECONDS:-3600}
      OFFSITE_KEEP_DAYS: ${OFFSITE_KEEP_DAYS:-30}
    volumes:
      - ./backup/offsite.sh:/scripts/offsite.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups:ro
      - ${RCLONE_CONFIG_DIR:-./rclone}:/config/rclone
    networks: [egress]

networks:
  internal:
  # Outbound only for the off-host copy; the database stays on `internal`.
  egress:

volumes:
  pgdata:
  caddy_data:
  caddy_config:
