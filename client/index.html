<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CrusadersOnline</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0f14; color: #e8e2d0; font: 14px/1.4 system-ui, sans-serif; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      #hud { position: fixed; top: 8px; left: 10px; font: 12px/1.5 ui-monospace, Consolas, monospace; text-shadow: 0 1px 2px #000; pointer-events: none; white-space: pre; }
      #overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(8, 9, 12, 0.6); cursor: pointer; }
      #overlay.hidden { display: none; }
      #overlay .panel { text-align: center; padding: 24px 32px; border: 1px solid #6b5a3a; background: rgba(20, 18, 14, 0.9); }
      #overlay h1 { margin: 0 0 12px; font-size: 22px; letter-spacing: 0.08em; color: #d9b45a; }
      #overlay p { margin: 4px 0; color: #bfb8a5; }
      #error { position: fixed; bottom: 12px; left: 12px; right: 12px; color: #ff8a80; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="overlay">
      <div class="panel">
        <h1>CrusadersOnline</h1>
        <p>Click to play</p>
        <p>WASD move &middot; Mouse look &middot; Space jump &middot; Shift walk &middot; Esc release mouse</p>
      </div>
    </div>
    <div id="error"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
