<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CrusadersOnline</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0f14; color: #e8e2d0; font: 14px/1.4 system-ui, sans-serif; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      #hud { position: fixed; top: 8px; left: 10px; font: 12px/1.5 ui-monospace, Consolas, monospace; text-shadow: 0 1px 2px #000; pointer-events: none; white-space: pre; }
      .overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(8, 9, 12, 0.6); }
      .overlay.hidden { display: none; }
      #overlay .panel { max-height: calc(100vh - 32px); overflow: auto; }
      #overlay .resume { justify-content: center; margin: 14px 0 6px; }
      #overlay .resume button { flex: 0 1 200px; }
      #click-hint { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 8px 14px; background: rgba(12,11,9,.72); border: 1px solid #6b5a3a; color: #f0e6cc; font: 14px/1.3 system-ui, sans-serif; pointer-events: none; z-index: 5; }
      .panel { text-align: center; padding: 24px 32px; border: 1px solid #6b5a3a; background: rgba(20, 18, 14, 0.94); min-width: 280px; max-width: calc(100vw - 32px); box-sizing: border-box; }
      .panel h1 { margin: 0 0 12px; font-size: 22px; letter-spacing: 0.08em; color: #d9b45a; }
      .panel p { margin: 4px 0; color: #bfb8a5; }
      .row { display: flex; gap: 8px; }
      .row button { flex: 1; }
      button { padding: 8px 12px; border: 1px solid #8a7445; background: #3a2f1c; color: #f0e6cc; font: inherit; cursor: pointer; }
      button:hover { background: #4c3d24; }
      button.secondary { background: transparent; border-color: #4a4232; color: #bfb8a5; }
      button:disabled { opacity: 0.5; cursor: default; }
      #error { position: fixed; bottom: 12px; left: 12px; right: 12px; color: #ff8a80; white-space: pre-wrap; }
      a.link { color: #bfb8a5; font-size: 12px; cursor: pointer; text-decoration: underline; }
      #world-ui { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
      .hpbar { position: absolute; left: 0; top: 0; text-align: center; font: 11px/1.2 system-ui, sans-serif; text-shadow: 0 1px 2px #000; white-space: nowrap; }
      .hpbar .track { width: 64px; height: 5px; margin: 2px auto 0; background: rgba(0,0,0,.6); border: 1px solid rgba(0,0,0,.8); }
      .hpbar .fill { height: 100%; background: #c0392b; }
      .hpbar.player .fill { background: #4caf50; }
      .hpbar.dead { opacity: .45; }
      .floater { position: absolute; left: 0; top: 0; font: 700 16px/1 system-ui, sans-serif; text-shadow: 0 2px 3px #000; white-space: nowrap; }
      .floater.dealt { color: #ffd54f; }
      .floater.taken { color: #ff6e6e; }
      .floater.other { color: #e0e0e0; font-size: 13px; }
      #player-panel { position: fixed; left: 12px; bottom: 12px; width: 240px; padding: 8px 10px; background: rgba(12,11,9,.72); border: 1px solid #6b5a3a; font: 12px/1.4 system-ui, sans-serif; }
      #player-panel .row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
      #player-panel .row > span:first-child { width: 34px; color: #d9b45a; }
      #player-panel .track { flex: 1; height: 8px; background: rgba(0,0,0,.6); border: 1px solid #000; }
      #player-panel .hp .fill { height: 100%; background: #c0392b; }
      #player-panel .mp .fill { height: 100%; background: #2e6fc0; }
      #player-panel .spell { color: #9fc3ff; }
      #player-panel .xp .fill { height: 100%; background: #d9b45a; }
      #player-panel .gold { color: #ffd54f; }
      /* Inventory: MU Online-style framed window (equipment board over the bag), bottom-right; the ground window opens beside it. */
      #inventory { --cell: clamp(22px, min(4vh, 4.4vw), 38px); --gold: #d9b45a; --gold-hi: #ffe08a; --frame: #6e5a35; position: fixed; inset: 0; pointer-events: none; z-index: 10; overflow: hidden; font: 12px/1.3 system-ui, sans-serif; color: #e8dcc0; }
      #inventory[hidden] { display: none; }
      #inventory .inv-dock { position: absolute; right: 14px; bottom: 14px; display: flex; align-items: stretch; max-height: calc(100% - 28px); }
      #inventory .inv-window { position: relative; pointer-events: auto; box-sizing: border-box; border: 1px solid #1a140b; outline: 1px solid var(--frame); outline-offset: -4px; background: radial-gradient(120% 80% at 50% 0%, rgba(70,56,34,.35), transparent 60%), linear-gradient(180deg, rgba(27,23,17,.97), rgba(10,9,7,.98)); box-shadow: 0 14px 40px rgba(0,0,0,.7), inset 0 0 0 5px rgba(0,0,0,.55), inset 0 0 0 6px rgba(218,183,98,.18); }
      #inventory .inv-window::before, #inventory .inv-window::after { content: ''; position: absolute; width: 14px; height: 14px; border: 2px solid var(--gold); pointer-events: none; opacity: .85; }
      #inventory .inv-window::before { top: 2px; left: 2px; border-right: 0; border-bottom: 0; }
      #inventory .inv-window::after { right: 2px; bottom: 2px; border-left: 0; border-top: 0; }
      #inventory .inv-main { padding: 10px 12px 10px; overflow: auto; }
      #inventory .inv-title { display: flex; align-items: center; justify-content: center; position: relative; margin: -2px 0 8px; padding: 3px 0 5px; border-bottom: 1px solid rgba(110,90,53,.7); background: linear-gradient(90deg, transparent, rgba(110,90,53,.25), transparent); }
      #inventory .inv-title h2 { margin: 0; color: var(--gold); font: 600 14px/1.1 "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; letter-spacing: .22em; text-transform: uppercase; text-shadow: 0 1px 3px #000; }
      #inventory .inv-x { position: absolute; right: 0; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; padding: 0; border: 1px solid #5a4a2c; background: #1c1710; color: #c9b88f; font: 16px/1 Georgia, serif; }
      #inventory .inv-x:hover { border-color: var(--gold); color: var(--gold-hi); background: #2a2216; }
      /* Equipment board: 8 cells wide like the bag, slots around a faint figure. */
      #inventory .inv-equipment { position: relative; display: grid; grid-template-columns: repeat(8, var(--cell)); grid-template-rows: repeat(6, var(--cell)); gap: 2px; padding: 3px; margin-bottom: 10px; background: radial-gradient(50% 60% at 50% 55%, rgba(120,96,56,.16), transparent 70%); }
      #inventory .equip-figure { grid-area: 1 / 3 / span 6 / span 4; z-index: 0; pointer-events: none; background: radial-gradient(closest-side at 50% 18%, rgba(185,160,110,.10) 0 40%, transparent 41%), radial-gradient(closest-side at 50% 62%, rgba(185,160,110,.08) 0 70%, transparent 71%); }
      #inventory .equip-slot { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; box-sizing: border-box; border: 1px solid #4d3f26; background: linear-gradient(180deg, rgba(5,5,4,.75), rgba(22,18,12,.8)); box-shadow: inset 0 0 10px #000; }
      #inventory .equip-slot.future { opacity: .45; border-style: dashed; }
      #inventory .equip-label { color: #6f6450; font: 600 9px/1 "Palatino Linotype", Georgia, serif; letter-spacing: .1em; text-transform: uppercase; text-align: center; pointer-events: none; }
      #inventory .equip-slot .inv-item { position: absolute; inset: 1px; border: 0; background: radial-gradient(circle at 50% 40%, rgba(120,98,60,.35), transparent 75%); }
      #inventory .equip-slot.equip-accepts { border-color: #a88a4c; box-shadow: inset 0 0 12px rgba(255,214,120,.18); }
      #inventory .equip-slot.drop-hover { border-color: #76d08f; box-shadow: inset 0 0 14px rgba(118,208,143,.45); }
      #inventory .equip-slot.drop-invalid { border-color: #e25a4d; box-shadow: inset 0 0 14px rgba(226,90,77,.45); }
      /* Bag grid. */
      #inventory .inv-grid { display: grid; grid-template-columns: repeat(var(--inv-columns), var(--cell)); grid-template-rows: repeat(var(--inv-rows), var(--cell)); gap: 2px; width: max-content; padding: 3px; border: 1px solid #3d321f; background: linear-gradient(180deg, #19150f, #0d0b08); box-shadow: inset 0 0 16px #000; }
      #inventory .inv-grid::before { content: ''; grid-column: 1 / -1; grid-row: 1 / -1; pointer-events: none; background: repeating-linear-gradient(90deg, rgba(255,235,190,.05) 0 1px, transparent 1px var(--cell), #030302 var(--cell) calc(var(--cell) + 2px)), repeating-linear-gradient(180deg, rgba(255,235,190,.05) 0 1px, transparent 1px var(--cell), #030302 var(--cell) calc(var(--cell) + 2px)); }
      #inventory .inv-drag-target { z-index: 3; pointer-events: none; border: 1px solid; box-sizing: border-box; }
      #inventory .inv-drag-target.valid { border-color: #76d08f; background: rgba(91,190,119,.22); }
      #inventory .inv-drag-target.invalid { border-color: #e25a4d; background: rgba(226,90,77,.24); }
      #inventory .inv-item { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 0; min-height: 0; padding: 0; overflow: hidden; border: 1px solid rgba(150,124,70,.45); background: linear-gradient(180deg, rgba(64,52,32,.55), rgba(20,17,12,.85)); color: #eee2c9; text-shadow: 0 1px 2px #000; font: 10px/1.05 system-ui, sans-serif; cursor: grab; z-index: 1; touch-action: none; user-select: none; }
      #inventory .inv-potion { background: linear-gradient(180deg, rgba(70,30,34,.5), rgba(20,12,12,.85)); }
      #inventory .inv-key, #inventory .inv-spellbook { background: linear-gradient(180deg, rgba(40,50,70,.5), rgba(12,14,20,.85)); }
      #inventory .inv-item:hover, #inventory .inv-item:focus-visible, #inventory .inv-item.drop-hover { outline: none; border-color: var(--gold-hi); box-shadow: inset 0 0 12px rgba(255,211,104,.3), 0 0 6px rgba(255,210,99,.35); }
      #inventory .inv-item.inv-dragging { opacity: .25; filter: grayscale(.7); }
      #inventory.inv-is-dragging .inv-item { cursor: grabbing; }
      #inventory .inv-item-thumb { position: absolute; inset: 2px; width: calc(100% - 4px); height: calc(100% - 4px); object-fit: contain; pointer-events: none; filter: drop-shadow(0 3px 4px rgba(0,0,0,.8)); z-index: 2; }
      #inventory .inv-item-name { position: absolute; left: 1px; right: 1px; bottom: 1px; z-index: 3; font-size: 8.5px; line-height: 1.1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
      #inventory .inv-mark { color: #e7c66e; font: calc(var(--cell) * .55)/1 Georgia, serif; text-shadow: 0 2px 5px #000; z-index: 1; pointer-events: none; }
      #inventory .inv-weapon .inv-mark { color: #d8dde1; } #inventory .inv-shield .inv-mark { color: #b8c6d5; } #inventory .inv-armor .inv-mark { color: #d0b17b; } #inventory .inv-potion .inv-mark { color: #d36d76; }
      #inventory .inv-quantity { position: absolute; right: 2px; top: 1px; z-index: 4; color: var(--gold-hi); font: 700 10px/1 system-ui, sans-serif; text-shadow: 0 0 3px #000, 0 1px 2px #000; pointer-events: none; }
      #inventory .inv-footer { display: flex; align-items: center; gap: 10px; margin-top: 9px; }
      #inventory .inv-gold { display: inline-flex; align-items: center; gap: 6px; min-width: 96px; padding: 3px 8px; border: 1px solid #4d3f26; background: #0b0a08; box-shadow: inset 0 0 6px #000; }
      #inventory .inv-gold i { width: 10px; height: 10px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff2b0, #d9a93a 55%, #7a5512); box-shadow: 0 0 3px rgba(255,200,80,.5); }
      #inventory .inv-gold b { color: var(--gold-hi); font-weight: 600; }
      #inventory .inv-count { flex: 1; font-size: 11px; color: #a69b85; }
      #inventory .inv-warning { color: #f0be70; }
      #inventory .inv-ground-toggle { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid #6e5a35; background: linear-gradient(180deg, #3a2f1c, #221b10); color: #f0e0b8; font: 600 11px/1 "Palatino Linotype", Georgia, serif; letter-spacing: .08em; text-transform: uppercase; }
      #inventory .inv-ground-toggle:hover { border-color: var(--gold); background: linear-gradient(180deg, #4c3d24, #2a2214); }
      #inventory .inv-ground-toggle[aria-pressed="true"] { border-color: var(--gold-hi); color: var(--gold-hi); box-shadow: inset 0 0 8px rgba(255,214,120,.25); }
      #inventory .inv-ground-toggle kbd { padding: 1px 4px; border: 1px solid #5a4a2c; background: #120f0a; color: #a69b85; font: 9px/1.2 ui-monospace, Consolas, monospace; letter-spacing: 0; text-transform: none; }
      /* Ground window: grows from zero width on the right, which pushes the inventory left. */
      #inventory .inv-ground { width: 0; margin-left: 0; overflow: hidden; opacity: 0; visibility: hidden; border-width: 0; transition: width .22s ease, margin-left .22s ease, opacity .18s ease, visibility 0s linear .22s; }
      #inventory .ground-open .inv-ground { width: 230px; margin-left: 8px; opacity: 1; visibility: visible; border-width: 1px; transition: width .22s ease, margin-left .22s ease, opacity .18s ease .04s, visibility 0s; }
      #inventory .inv-ground-inner { width: 230px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; padding: 10px 12px; }
      #inventory .inv-ground.drop-hover { box-shadow: 0 0 18px rgba(255,213,79,.45), inset 0 0 0 6px rgba(255,213,79,.25); }
      #inventory .ground-list { flex: 1; display: grid; align-content: start; gap: 4px; overflow: auto; min-height: 0; }
      #inventory .ground-item { display: grid; grid-template-columns: 20px 1fr; gap: 6px; align-items: center; padding: 5px 7px; border: 1px solid #3d321f; background: rgba(8,7,5,.7); color: #e8e0ce; text-align: left; font: 12px/1.25 system-ui, sans-serif; }
      #inventory .ground-item:hover, #inventory .ground-item:focus-visible { border-color: var(--gold); outline: none; background: rgba(94,76,42,.35); }
      #inventory .ground-item .inv-mark { font-size: 14px; } #inventory .ground-item small { display: block; color: #8f846d; font-size: 10px; }
      #inventory .inv-help, #inventory .inv-empty { margin: 8px 1px 0; color: #8f846d; font-size: 11px; }
      /* Item tooltip (MU style: centred lines, coloured name). */
      #inventory .inv-tooltip { position: fixed; left: 0; top: 0; z-index: 31; display: flex; flex-direction: column; align-items: center; gap: 2px; max-width: 230px; padding: 8px 12px; border: 1px solid #6e5a35; background: rgba(4,4,3,.94); box-shadow: 0 6px 18px rgba(0,0,0,.7); color: #d8d0bc; font: 11.5px/1.3 system-ui, sans-serif; text-align: center; pointer-events: none; }
      #inventory .inv-tooltip[hidden] { display: none; }
      #inventory .tt-name { color: #ffffff; font: 600 13px/1.2 "Palatino Linotype", Georgia, serif; margin-bottom: 2px; }
      #inventory .tt-weapon, #inventory .tt-shield, #inventory .tt-armor { color: var(--gold-hi); }
      #inventory .tt-spellbook, #inventory .tt-key { color: #8fc0ff; }
      #inventory .tt-type { color: #8f846d; font-size: 10.5px; margin-bottom: 3px; }
      #inventory .inv-tooltip small { margin-top: 5px; color: #7d735f; font-size: 10px; }
      /* Held item (appended to body, above everything). */
      .inv-drag-preview { position: fixed; left: 0; top: 0; z-index: 40; pointer-events: none; display: grid; place-items: center; filter: drop-shadow(0 10px 14px rgba(0,0,0,.85)); }
      .inv-drag-preview canvas { grid-area: 1 / 1; width: 100%; height: 100%; display: block; }
      .inv-drag-glyph { grid-area: 1 / 1; color: #e7c66e; font: 30px/1 Georgia, serif; text-shadow: 0 2px 6px #000; }
      .inv-drag-preview.inv-drag-has-model .inv-drag-glyph { display: none; }
      .inv-drag-preview:not(.inv-drag-has-model) canvas { visibility: hidden; }
      @media (max-width: 640px) { #inventory .inv-dock { right: 8px; bottom: 8px; } #inventory .ground-open .inv-ground, #inventory .inv-ground-inner { width: 170px; } }
      #subtitle { z-index: 10; position: fixed; left: 50%; bottom: 30%; transform: translateX(-50%); max-width: min(640px, calc(100vw - 32px)); padding: 8px 14px; background: rgba(12,11,9,.8); border: 1px solid #6b5a3a; color: #f0e6cc; font: 15px/1.4 system-ui, sans-serif; text-align: center; pointer-events: none; }
      #subtitle .who { color: #d9b45a; font-weight: 600; margin-right: 6px; }
      #quest-book { position: fixed; inset: 0; z-index: 12; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.25); }
      #quest-book[hidden] { display: none; }
      #quest-book .qb-screen { position: relative; width: 640px; height: 480px; transform-origin: center; scale: min(1.5, calc(100vw / 680px), calc(100vh / 520px)); cursor: default; }
      #quest-book .qb-screen img { position: absolute; pointer-events: none; user-select: none; }
      #quest-book .qb-glass { left: 32px; top: 70px; width: 500px; height: 390px; opacity: .85; }
      #quest-book .qb-page { position: absolute; left: 60px; top: 132px; width: 446px; height: 280px; overflow: auto; white-space: pre-wrap; color: #f4e8c8; font: 15px/1.45 Georgia, 'Times New Roman', serif; text-shadow: 0 1px 2px #000; }
      #quest-book .qb-page:empty::before { content: '—'; color: #9a8f78; }
      #quest-book .qb-page[data-pages]:not([data-pages=""])::after { content: attr(data-pages); position: sticky; display: block; bottom: 0; margin-top: 10px; color: #bfa66a; font-size: 12px; text-align: right; }
      #cutscene { position: fixed; inset: 0; pointer-events: none; z-index: 8; }
      #cutscene[hidden] { display: none; }
      #cutscene .bar { position: absolute; left: 0; right: 0; height: 6vh; background: #000; }
      #cutscene .bar.top { top: 0; }
      #cutscene .bar.bottom { bottom: 0; }
      #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 9; }
      #prompt { position: fixed; left: 50%; bottom: 22%; transform: translateX(-50%); padding: 6px 12px; background: rgba(12,11,9,.72); border: 1px solid #6b5a3a; color: #f0e6cc; font: 14px/1.3 system-ui, sans-serif; pointer-events: none; }
      .floater.notice { color: #9be08a; font-size: 14px; }
      #game-files { position: fixed; top: 12px; right: 12px; width: min(320px, calc(100vw - 32px)); padding: 10px 12px; background: rgba(20,18,14,.94); border: 1px solid #6b5a3a; z-index: 20; font: 13px/1.4 system-ui, sans-serif; box-sizing: border-box; }
      #game-files .title { color: #d9b45a; font-weight: 600; letter-spacing: .04em; }
      #game-files .status { margin: 4px 0; }
      #game-files .hint { color: #9a8f78; font-size: 12px; margin: 6px 0 8px; }
      #game-files .button { display: inline-block; padding: 6px 10px; border: 1px solid #8a7445; background: #3a2f1c; color: #f0e6cc; cursor: pointer; }
      #game-files .log { margin: 8px 0 0; max-height: 120px; overflow: auto; white-space: pre-wrap; font: 11px/1.35 ui-monospace, Consolas, monospace; color: #bfb8a5; }
      #overlay .panel { width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 40px); overflow: hidden; display: flex; flex-direction: column; padding: 20px 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.85), inset 0 0 0 1px rgba(217,180,90,0.15); }
      #overlay .panel h1 { margin: 0 0 8px; font: 600 20px/1 "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; letter-spacing: .12em; text-transform: uppercase; color: #d9b45a; text-shadow: 0 1px 4px #000; }
      .opt-container { display: flex; flex-direction: column; text-align: left; margin: 6px 0 0; min-height: 0; flex: 1; }
      .opt-tabs { display: flex; gap: 4px; border-bottom: 1px solid rgba(107, 90, 58, 0.45); padding-bottom: 2px; }
      .opt-tab { background: transparent; border: 1px solid transparent; border-bottom: 2px solid transparent; color: #a89f8c; padding: 8px 14px; font-weight: 600; font-size: 13px; letter-spacing: 0.04em; cursor: pointer; transition: all .15s ease; border-radius: 4px 4px 0 0; display: inline-flex; align-items: center; gap: 6px; }
      .opt-tab:hover { color: #f0e6cc; background: rgba(217,180,90,0.06); }
      .opt-tab.active { color: #d9b45a; border-bottom-color: #d9b45a; background: rgba(217,180,90,0.12); }
      .opt-tab-icon { font-size: 14px; }
      .opt-content { flex: 1; min-height: 260px; max-height: 52vh; overflow-y: auto; padding: 12px 6px 12px 0; scrollbar-width: thin; scrollbar-color: #5a4a2c rgba(0,0,0,0.3); }
      .opt-content::-webkit-scrollbar { width: 6px; }
      .opt-content::-webkit-scrollbar-thumb { background: #5a4a2c; border-radius: 3px; }
      .opt-group { background: rgba(14, 12, 10, 0.65); border: 1px solid rgba(107, 90, 58, 0.35); border-radius: 4px; padding: 12px 14px; margin-bottom: 10px; }
      .opt-group-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
      .opt-group-header h3 { margin: 0; font-size: 13.5px; color: #f0e6cc; font-weight: 600; }
      .opt-badge { font: 11px/1.3 ui-monospace, Consolas, monospace; background: #262016; color: #d9b45a; border: 1px solid #6b5a3a; padding: 2px 8px; border-radius: 3px; }
      .opt-slider-row { display: flex; align-items: center; gap: 10px; }
      .opt-slider-row input[type=range] { flex: 1; accent-color: #d9b45a; cursor: pointer; height: 6px; }
      .opt-slider-label { font-size: 11px; color: #7d766a; width: 42px; text-align: center; }
      .opt-desc { margin: 6px 0 0; font-size: 11.5px; color: #8e8573; line-height: 1.4; }
      .opt-toggle-group { margin-bottom: 8px; padding: 10px 14px; }
      .opt-toggle-label { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; user-select: none; }
      .opt-toggle-label input { margin-top: 3px; accent-color: #d9b45a; cursor: pointer; width: 16px; height: 16px; }
      .opt-toggle-text { display: flex; flex-direction: column; gap: 2px; }
      .opt-toggle-text strong { color: #f0e6cc; font-size: 13px; font-weight: 600; }
      .opt-info-card { border-left: 3px solid #d9b45a; }
      .opt-info-card h4 { margin: 0 0 4px; font-size: 13px; color: #f0e6cc; }
      /* Keybindings */
      .opt-subtabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
