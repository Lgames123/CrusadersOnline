<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CrusadersOnline</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0f14; color: #e8e2d0; font: 14px/1.4 system-ui, sans-serif; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      #hud { position: fixed; top: 8px; left: 10px; font: 12px/1.5 ui-monospace, Consolas, monospace; text-shadow: 0 1px 2px #000; pointer-events: none; white-space: pre; }
      .overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(8, 9, 12, 0.6); }
      .overlay.hidden { display: none; }
      #overlay { cursor: pointer; }
      .panel { text-align: center; padding: 24px 32px; border: 1px solid #6b5a3a; background: rgba(20, 18, 14, 0.94); min-width: 280px; max-width: calc(100vw - 32px); box-sizing: border-box; }
      .panel h1 { margin: 0 0 12px; font-size: 22px; letter-spacing: 0.08em; color: #d9b45a; }
      .panel p { margin: 4px 0; color: #bfb8a5; }
      #login form { display: grid; gap: 8px; margin-top: 8px; }
      #login input { padding: 8px 10px; border: 1px solid #6b5a3a; background: #14120e; color: #e8e2d0; font: inherit; }
      #login input:focus { outline: 2px solid #d9b45a; outline-offset: 0; }
      .row { display: flex; gap: 8px; }
      .row button { flex: 1; }
      button { padding: 8px 12px; border: 1px solid #8a7445; background: #3a2f1c; color: #f0e6cc; font: inherit; cursor: pointer; }
      button:hover { background: #4c3d24; }
      button.secondary { background: transparent; border-color: #4a4232; color: #bfb8a5; }
      button:disabled { opacity: 0.5; cursor: default; }
      #login-error { min-height: 1.4em; color: #ff8a80; font-size: 13px; }
      #error { position: fixed; bottom: 12px; left: 12px; right: 12px; color: #ff8a80; white-space: pre-wrap; }
      a.link { color: #bfb8a5; font-size: 12px; cursor: pointer; text-decoration: underline; }
      #world-ui { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
      .hpbar { position: absolute; left: 0; top: 0; text-align: center; font: 11px/1.2 system-ui, sans-serif; text-shadow: 0 1px 2px #000; white-space: nowrap; }
      .hpbar .track { width: 64px; height: 5px; margin: 2px auto 0; background: rgba(0,0,0,.6); border: 1px solid rgba(0,0,0,.8); }
      .hpbar .fill { height: 100%; background: #c0392b; }
      .hpbar.player .fill { background: #4caf50; }
      .hpbar.dead { opacity: .45; }
      .floater { position: absolute; left: 0; top: 0; font: 700 16px/1 system-ui, sans-serif; text-shadow: 0 2px 3px #000; white-space: nowrap; }
      .floater.dealt { color: #ffd54f; }
      .floater.taken { color: #ff6e6e; }
      .floater.other { color: #e0e0e0; font-size: 13px; }
      #player-panel { position: fixed; left: 12px; bottom: 12px; width: 240px; padding: 8px 10px; background: rgba(12,11,9,.72); border: 1px solid #6b5a3a; font: 12px/1.4 system-ui, sans-serif; }
      #player-panel .row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
      #player-panel .row > span:first-child { width: 34px; color: #d9b45a; }
      #player-panel .track { flex: 1; height: 8px; background: rgba(0,0,0,.6); border: 1px solid #000; }
      #player-panel .hp .fill { height: 100%; background: #c0392b; }
      #player-panel .xp .fill { height: 100%; background: #d9b45a; }
      #player-panel .gold { color: #ffd54f; }
      #inventory { position: fixed; right: 12px; top: 50%; transform: translateY(-50%); width: min(360px, calc(100vw - 32px)); max-height: 80vh; overflow: auto; padding: 10px 14px; background: rgba(20,18,14,.96); border: 1px solid #6b5a3a; z-index: 10; box-sizing: border-box; }
      #inventory .head { display: flex; align-items: center; justify-content: space-between; }
      #inventory h2 { margin: 0; font-size: 16px; color: #d9b45a; letter-spacing: .06em; }
      #inventory h3 { margin: 10px 0 4px; font-size: 12px; color: #bfb8a5; text-transform: uppercase; letter-spacing: .08em; }
      #inventory ul { list-style: none; margin: 0; padding: 0; }
      #inventory li { display: grid; grid-template-columns: 56px 1fr; gap: 0 8px; padding: 6px 8px; border: 1px solid transparent; cursor: pointer; }
      #inventory li:hover { border-color: #8a7445; background: #2a2316; }
      #inventory li[data-equipped="true"] .name { color: #ffd54f; }
      #inventory li.empty { cursor: default; color: #7d766a; display: block; }
      #inventory .kind { color: #9a8f78; font-size: 11px; grid-row: span 2; align-self: center; }
      #inventory .stats { color: #9a8f78; font-size: 11px; }
      #inventory .count { color: #7d766a; text-transform: none; }
      #prompt { position: fixed; left: 50%; bottom: 22%; transform: translateX(-50%); padding: 6px 12px; background: rgba(12,11,9,.72); border: 1px solid #6b5a3a; color: #f0e6cc; font: 14px/1.3 system-ui, sans-serif; pointer-events: none; }
      .floater.notice { color: #9be08a; font-size: 14px; }
      #death { position: fixed; top: 30%; left: 0; right: 0; text-align: center; font: 700 28px/1.2 system-ui, sans-serif; color: #ff6e6e; text-shadow: 0 2px 6px #000; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="world-ui"></div>
    <div id="hud"></div>
    <div id="player-panel" hidden></div>
    <div id="inventory" hidden></div>
    <div id="prompt" hidden></div>
    <div id="death" hidden>You have fallen — respawning…</div>
    <div id="login" class="overlay hidden">
      <div class="panel">
        <h1>CrusadersOnline</h1>
        <form id="login-form" autocomplete="on">
          <input id="login-username" name="username" placeholder="Username" autocomplete="username" required minlength="3" maxlength="20" pattern="[A-Za-z0-9_]+" />
          <input id="login-password" name="password" type="password" placeholder="Password (8+ characters)" autocomplete="current-password" required minlength="8" maxlength="128" />
          <div class="row">
            <button type="submit" id="btn-login">Log in</button>
            <button type="button" id="btn-register">Create account</button>
          </div>
          <div class="row">
            <button type="button" class="secondary" id="btn-guest">Play as guest</button>
            <button type="button" class="secondary" id="btn-offline">Play offline</button>
          </div>
          <div id="login-error" role="alert"></div>
        </form>
      </div>
    </div>
    <div id="overlay" class="overlay hidden">
      <div class="panel">
        <h1>CrusadersOnline</h1>
        <p>Click to play</p>
        <p>WASD move &middot; Mouse look &middot; Left click attack &middot; Right click block &middot; E pick up / open &middot; I inventory &middot; Space jump &middot; Shift walk &middot; Esc release mouse</p>
        <p><a class="link" id="btn-logout" hidden>Log out</a></p>
      </div>
    </div>
    <div id="error"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
