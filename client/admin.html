<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CrusadersOnline Admin</title>
    <style>
      :root {
        --bg: #0d0f14; --panel: #15171d; --panel2: #1c1f27; --line: #2c3040; --gold: #c9a35a; --gold-dim: #6b5a3a;
        --text: #e8e2d0; --muted: #9a937f; --ok: #8fd18a; --bad: #ff8a7a; --warn: #ffb347; --blue: #9fc3ff;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
      a { color: var(--gold); }
      header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; padding: 10px 16px; background: #101219; border-bottom: 1px solid var(--gold-dim); }
      header h1 { margin: 0; font: 600 17px/1 Georgia, "Palatino Linotype", serif; color: var(--gold); letter-spacing: .5px; }
      header .who { margin-left: auto; color: var(--muted); font-size: 13px; }
      nav { display: flex; flex-wrap: wrap; gap: 2px; }
      nav button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); padding: 6px 10px; font: inherit; cursor: pointer; }
      nav button:hover { color: var(--text); }
      nav button.on { color: var(--gold); border-bottom-color: var(--gold); }
      nav .badge { margin-left: 4px; padding: 0 5px; border-radius: 8px; background: var(--gold-dim); color: var(--text); font-size: 11px; }
      main { padding: 16px; max-width: 1400px; margin: 0 auto; }
      [hidden] { display: none !important; }
      h2 { margin: 0 0 10px; font: 600 15px/1.3 Georgia, serif; color: var(--gold); }
      h3 { margin: 14px 0 6px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
      .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); align-items: start; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; min-width: 0; }
      .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 14px; }
      .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
      .stat b { display: block; font-size: 22px; color: var(--text); font-variant-numeric: tabular-nums; }
      .stat span { color: var(--muted); font-size: 12px; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
      th { color: var(--muted); font-weight: 600; font-size: 12px; white-space: nowrap; }
      td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
      tr.sel td { background: #232838; }
      tbody tr { cursor: default; }
      .scroll { overflow: auto; }
      label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
      label.inline { flex-direction: row; align-items: center; gap: 6px; color: var(--text); font-size: 13px; }
      .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; margin-bottom: 8px; }
      .row > label { flex: 1 1 110px; }
      .row > label.narrow { flex: 0 1 90px; }
      input, select, textarea { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; font: inherit; min-width: 0; width: 100%; }
      input[type=checkbox], input[type=radio] { width: auto; }
      input:focus, select:focus, textarea:focus { outline: 1px solid var(--gold-dim); border-color: var(--gold-dim); }
      button { background: #2a2416; color: var(--text); border: 1px solid var(--gold-dim); border-radius: 4px; padding: 6px 12px; font: inherit; cursor: pointer; white-space: nowrap; }
      button:hover { background: #3a3120; }
      button.small { padding: 2px 8px; font-size: 12px; }
      button.danger { border-color: #7a3a32; background: #2a1715; }
      button.danger:hover { background: #3e1f1b; }
      button.ghost { background: none; border-color: var(--line); }
      button:disabled { opacity: .5; cursor: default; }
      .actions { display: flex; flex-wrap: wrap; gap: 4px; }
      .muted { color: var(--muted); }
      .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
      .pill { display: inline-block; padding: 0 6px; border-radius: 9px; font-size: 11px; border: 1px solid var(--line); color: var(--muted); }
      .pill.active { color: var(--ok); border-color: #3c6b3a; } .pill.scheduled { color: var(--blue); border-color: #3a4f6b; } .pill.bad { color: var(--bad); border-color: #7a3a32; }
      #chat-log { height: 56vh; min-height: 260px; overflow: auto; background: #0f1116; border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; font: 13px/1.5 ui-monospace, Consolas, monospace; }
      .cl { white-space: pre-wrap; word-break: break-word; }
      .cl .t { color: #6d6858; margin-right: 6px; }
      .cl .ch { display: inline-block; min-width: 54px; margin-right: 6px; font-size: 11px; text-transform: uppercase; }
      .cl.local .ch { color: #d7d0bb; } .cl.global .ch { color: var(--blue); } .cl.private .ch { color: #d8a0ff; } .cl.admin .ch, .cl.admin { color: var(--warn); }
      .cl .n { color: var(--gold); cursor: pointer; } .cl .n:hover { text-decoration: underline; }
      .cl .z { color: #6d6858; margin-left: 6px; font-size: 11px; }
      #toast { position: fixed; right: 16px; bottom: 16px; z-index: 20; display: flex; flex-direction: column; gap: 6px; max-width: min(420px, calc(100vw - 32px)); }
      #toast div { padding: 8px 12px; background: #1d2a1c; border: 1px solid #3c6b3a; border-radius: 4px; box-shadow: 0 4px 16px #0008; }
      #toast div.err { background: #2a1715; border-color: #7a3a32; }
      #login { max-width: 340px; margin: 12vh auto; }
      .hint { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
      .loot-row { display: grid; grid-template-columns: 1fr 80px 70px auto; gap: 6px; margin-bottom: 6px; }
      .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
      fieldset { border: 1px solid var(--line); border-radius: 4px; margin: 0 0 8px; padding: 8px 10px; }
      legend { color: var(--muted); font-size: 12px; padding: 0 4px; }
      @media (max-width: 640px) {
        main { padding: 10px 16px; }
        header .who { margin-left: 0; width: 100%; }
        .loot-row { grid-template-columns: 1fr 70px 60px auto; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="toast"></div>
    <script type="module" src="/src/admin/admin_main.ts"></script>
  </body>
</html>
