# Continuous integration: typecheck, unit + integration tests (PGlite and a real PostgreSQL 18),
# the two-browser Playwright E2E, and the container images. Images are pushed to GHCR from main
# only when the repository variable PUBLISH_IMAGES is set to 'true' (Settings > Variables).
# Runs only on repository sources: no original game files exist in the repository or in CI.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: crusaders
          POSTGRES_PASSWORD: crusaders_ci
          POSTGRES_DB: crusaders_online
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crusaders -d crusaders_online"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Unit and integration tests (PGlite + PostgreSQL)
        run: pnpm test
        env:
          TEST_POSTGRES_URL: postgresql://crusaders:crusaders_ci@127.0.0.1:5432/crusaders_online
      - name: Install Playwright Chromium
        run: pnpm --filter @crusaders/tests exec playwright install --with-deps chromium
      - name: Two-browser E2E
        run: pnpm test:e2e
        env:
          PW_CHANNEL: chromium
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: tests/test-results/
          if-no-files-found: ignore

  images:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLISH_IMAGES == 'true' }}
    strategy:
      matrix:
        include:
          - name: server
            dockerfile: deployment/Dockerfile.server
          - name: web
            dockerfile: deployment/Dockerfile.client
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ steps.image.outputs.repo }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.repo }}:main
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
